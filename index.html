<title>Meu Fichário Pokémon</title>
<style>
:root { --fundo:#f4f5f7; --cartao:#fff; --texto:#1b1d24; --suave:#6b7280; --borda:#e3e5ea;
        --verde:#1E9E5A; --vermelho:#E3350D; --amarelo:#FFCB05; }
@media (prefers-color-scheme: dark) {
  :root { --fundo:#111318; --cartao:#1b1d24; --texto:#f2f2f2; --suave:#9aa0a6; --borda:#2c2f38; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--fundo); color:var(--texto);
       font:15px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--fundo); padding:12px 14px 8px;
         border-bottom:1px solid var(--borda); }
h1 { margin:0; font-size:1.25rem; }
h1 small { display:block; font-size:.72rem; font-weight:400; color:var(--suave); }
input[type=search], select { width:100%; font-size:16px; padding:11px 12px; border-radius:12px;
       border:1px solid var(--borda); background:var(--cartao); color:var(--texto); margin-top:9px; }
input[type=search]:focus { outline:2px solid var(--vermelho); border-color:transparent; }
.chips { display:flex; gap:6px; margin-top:9px; }
.chips button { flex:1; padding:8px 0; border-radius:999px; border:1px solid var(--borda);
       background:var(--cartao); color:var(--texto); font-size:.9rem; }
.chips button.on { background:var(--texto); color:var(--fundo); border-color:var(--texto); font-weight:600; }
#resumo { margin-top:8px; font-size:.85rem; color:var(--suave); }
#resumo b { color:var(--texto); }
main { padding:12px 10px 40px; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
.carta { background:var(--cartao); border-radius:12px; padding:7px; border:2px solid transparent; position:relative; }
.carta.tem { border-color:var(--verde); }
.carta.falta img { filter:grayscale(.85); opacity:.6; }
.carta.vazio img { filter:grayscale(1) brightness(.6); opacity:.35; }
.carta img { width:100%; aspect-ratio:63/88; object-fit:contain; display:block; border-radius:6px; background:rgba(127,127,127,.08); }
.selo { position:absolute; top:12px; left:12px; font-size:.75rem; font-weight:700; padding:3px 9px;
        border-radius:999px; color:#fff; background:var(--vermelho); box-shadow:0 1px 4px rgba(0,0,0,.3); }
.tem .selo { background:var(--verde); }
.vazio .selo { background:#777; }
.nome { font-weight:600; margin-top:6px; font-size:.92rem; }
.info { font-size:.78rem; color:var(--suave); margin-top:2px; }
.fich { font-size:.72rem; margin-top:4px; color:var(--suave); font-style:italic; }
.lista { grid-column:1/-1; display:grid; gap:10px; }
.bloco { background:var(--cartao); border-radius:14px; padding:14px; border:1px solid var(--borda); }
.bloco h2 { margin:0 0 4px; font-size:1.05rem; }
.barra { height:8px; background:rgba(127,127,127,.2); border-radius:9px; overflow:hidden; margin-top:8px; }
.barra div { height:100%; background:var(--verde); }
.vazia { grid-column:1/-1; text-align:center; color:var(--suave); padding:30px 10px; }
#mais { display:block; margin:0 auto 40px; padding:12px 24px; border-radius:999px; border:0;
        background:var(--texto); color:var(--fundo); font-size:1rem; }
#mais[hidden] { display:none; }
#zoom { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.88); display:flex; flex-direction:column;
        align-items:center; justify-content:center; padding:20px; color:#fff; text-align:center; }
#zoom[hidden] { display:none; }
#zoom img { max-width:100%; max-height:72vh; border-radius:12px; }
#zoom .zinfo { margin-top:12px; font-size:.95rem; }
</style>
</head>

ex":1023,"pk":"Iron Crown","vazio":1},{"n":"","num":"","tot":null,"col":"","var":"","idi":[],"t":0,"p":null,"img":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1024.png","dex":1024,"pk":"Terapagos","vazio":1},{"n":"","num":"","tot":null,"col":"","var":"","idi":[],"t":0,"p":null,"img":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1025.png","dex":1025,"pk":"Pecharunt","vazio":1}]}];
const PAGINA = 60;
const $ = s => document.querySelector(s);
const norm = s => (s == null ? "" : String(s)).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const semZeros = s => String(s).replace(/(^|\/)0+(?=\d)/g, "$1");
const reais = v => v == null ? "" : v.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const todos = [];
DADOS.forEach((f, i) => f.itens.forEach(c => {
  c.k = todos.length;
  const numero = c.num + (c.tot ? "/" + c.tot : "");
  c.fi = i;
  c.numero = numero;
  c.busca = norm([c.n, c.pk, c.col, c.var, c.num, numero, semZeros(c.num), semZeros(numero),
                  c.dex ? "#" + c.dex : ""].join(" "));
  todos.push(c);
}));

let fich = -1, filtro = "todas", limite = PAGINA;
const sel = $("#fich");
sel.innerHTML = '<option value="-1">Todos os fichários</option>' +
  DADOS.map((f, i) => `<option value="${i}">${esc(f.nome)} · ${esc(f.tipo)}</option>`).join("");

function passa(c, termos) {
  if (filtro === "tenho" && !c.t) return false;
  if (filtro === "falta" && c.t) return false;
  return termos.every(t => c.busca.includes(t) || c.busca.includes(semZeros(t)));
}

function cartaHTML(c) {
  const classe = c.vazio ? "vazio" : (c.t ? "tem" : "falta");
  const selo = c.vazio ? "Sem carta" : (c.t ? "✓ Tenho" : "Falta");
  const titulo = c.vazio ? `#${String(c.dex).padStart(3, "0")} ${esc(c.pk)}` : esc(c.n);
  const info = c.vazio ? "Nenhuma carta escolhida" :
    [esc(c.col), "nº " + esc(c.numero), c.var ? esc(c.var) : "", c.idi && c.idi.length ? c.idi.join("+").toUpperCase() : ""]
      .filter(Boolean).join(" · ");
  const extra = (c.dex && !c.vazio ? `<div class="info">Pokédex #${String(c.dex).padStart(3, "0")} ${esc(c.pk)}</div>` : "") +
    (c.p != null && !c.vazio ? `<div class="info">≈ ${reais(c.p)}</div>` : "") +
    (fich < 0 ? `<div class="fich">${esc(DADOS[c.fi].nome)}</div>` : "");
  const img = c.img ? `<img src="${esc(c.img)}" loading="lazy" alt="">` : `<img alt="">`;
  return `<div class="carta ${classe}" data-k="${c.k}"><span class="selo">${selo}</span>${img}` +
         `<div class="nome">${titulo}</div><div class="info">${info}</div>${extra}</div>`;
}

function resumoFichario(i) {
  const f = DADOS[i], cartas = f.itens.filter(c => !c.vazio);
  const tenho = f.itens.filter(c => c.t), valor = tenho.reduce((s, c) => s + (c.p || 0), 0);
  const total = f.itens.length;
  return {f, total, tenho: tenho.length, escolhidas: cartas.length, valor};
}

function desenhar() {
  const termos = norm($("#q").value).split(/\s+/).filter(Boolean);
  const grade = $("#grade");
  $("#mais").hidden = true;
  if (fich < 0 && !termos.length) {
    // tela inicial: um resumo por fichário
    $("#resumo").innerHTML = "Digite acima para procurar em <b>todos</b> os fichários, ou toque em um fichário.";
    grade.innerHTML = '<div class="lista">' + DADOS.map((_, i) => {
      const r = resumoFichario(i), pct = r.total ? Math.round(100 * r.tenho / r.total) : 0;
      return `<div class="bloco" data-f="${i}"><h2>${esc(r.f.nome)}</h2>
        <div class="info">${esc(r.f.tipo)} · ${esc(r.f.idioma)}</div>
        <div class="info">Você tem <b>${r.tenho}</b> de ${r.total} (${pct}%)${r.valor ? " · ≈ " + reais(r.valor) : ""}</div>
        <div class="barra"><div style="width:${pct}%"></div></div></div>`;
    }).join("") + "</div>";
    return;
  }
  const base = fich < 0 ? todos : todos.filter(c => c.fi === fich);
  const achadas = base.filter(c => passa(c, termos));
  const tenho = achadas.filter(c => c.t).length;
  let txt = `<b>${achadas.length}</b> ${achadas.length === 1 ? "carta" : "cartas"} · você tem <b>${tenho}</b>`;
  if (fich >= 0 && !termos.length && filtro === "todas") {
    const r = resumoFichario(fich);
    if (r.valor) txt += ` · valor do que você tem ≈ <b>${reais(r.valor)}</b>`;
  }
  $("#resumo").innerHTML = txt;
  if (!achadas.length) {
    grade.innerHTML = `<div class="vazia">Nenhuma carta encontrada${termos.length ? " para essa busca" : ""}.<br>` +
      (termos.length ? "Se é uma carta que você não colocou em nenhum fichário, você não a tem registrada." : "") + "</div>";
    return;
  }
  grade.innerHTML = achadas.slice(0, limite).map(cartaHTML).join("");
  $("#mais").hidden = achadas.length <= limite;
}

$("#q").addEventListener("input", () => { limite = PAGINA; desenhar(); });
sel.addEventListener("change", () => { fich = +sel.value; limite = PAGINA; desenhar(); window.scrollTo(0, 0); });
document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".chips button").forEach(x => x.classList.toggle("on", x === b));
  filtro = b.dataset.f; limite = PAGINA; desenhar();
}));
$("#mais").addEventListener("click", () => { limite += PAGINA; desenhar(); });
$("#grade").addEventListener("click", e => {
  const bloco = e.target.closest(".bloco");
  if (bloco) { fich = +bloco.dataset.f; sel.value = fich; desenhar(); window.scrollTo(0, 0); return; }
  const el = e.target.closest(".carta");
  if (!el) return;
  const c = todos[+el.dataset.k];
  if (!c.img || c.vazio) return;
  $("#zoom img").src = c.img.replace(/low\.webp$/, "high.webp");
  $("#zoom .zinfo").innerHTML = `<b>${esc(c.n)}</b><br>${esc(c.col)} · nº ${esc(c.numero)}<br>` +
    (c.t ? "✓ Você tem esta carta" : "Você ainda não tem esta carta") + `<br><small>${esc(DADOS[c.fi].nome)}</small>`;
  $("#zoom").hidden = false;
});
$("#zoom").addEventListener("click", () => { $("#zoom").hidden = true; $("#zoom img").src = ""; });
desenhar();
</script>
